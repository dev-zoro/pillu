<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fde8ee">
  <title>Happy Birthday Pillu ♥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: title + heart. Clicking the heart makes it grow and reveals the cover photo -->
  <main id="intro" class="screen">
    <div class="stack">
      <h1 class="title">Happy Birthday</h1>

      <button id="heartBtn" class="heart-btn" type="button"
              aria-label="Click the heart to open your birthday wish"></button>

      <p class="title name">Pillu</p>

      <p class="start-hint">(Click the heart)</p>
      <p class="note">(click anywhere)</p>
    </div>
  </main>

  <!-- Screen 2: two lines, then a heart with a photo. Repeats for every page -->
  <section id="story" class="screen" hidden>
    <div class="stack">
      <div id="page" class="page"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
